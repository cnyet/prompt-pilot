name: Feature request
description: 提出新能力或改进建议
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先读 `PRODUCT.md` 的「非目标」一节，避免提出首版明确不做的范围。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁在什么场景下遇到了什么阻碍
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 期望的交互或行为，尽量具体
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 考虑过但没有采用的方案，以及原因

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 工作台
        - 提示词库
        - 评估
        - 模板
        - 设置
        - 导出 / 导入
        - 文档或工程配置
    validations:
      required: true